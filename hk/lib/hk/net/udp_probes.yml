# hk/lib/hk/net/udp_probes.yml
# Probes for UDP services. Inspired by nmap-service-probes.
# Format:
# - name: Service Name
#   port: UDP Port Number
#   probe: Hex-encoded probe string to send
#   match:
#     type: "regex" # or "exact"
#     pattern: Regex pattern (as string) or exact string to match in response
#     version_capture_group: (Optional) Integer, index of regex capture group for version

# Note: Hex strings must be valid hex and will be decoded to binary.
# Ensure regex patterns are YAML-safe (e.g., escape special characters if needed).

- name: "dns"
  port: 53
  probe: "000101000001000000000000076578616d706c6503636f6d0000010001" # Standard DNS query for example.com A record
  # No specific match needed for basic "is it DNS?" check, response presence is enough.
  # A more specific match would look for DNS response codes or parts of the example.com query.

- name: "ntp"
  port: 123
  probe: "1700032a00000000" # NTP v2, Mode 7 (private), for requesting MON_GETLIST_1 (monlist)
  # No specific match needed for basic "is it NTP?" check. Vulnerable servers might return a list.

- name: "snmp"
  port: 161
  probe: "302602010104067075626c6963a019020400000000020100020100020100300b300906052b060102010500" # SNMPv2c GET-REQUEST for sysDescr.0 with public community
  match:
    type: "regex"
    pattern: "^\x30" # Expect an ASN.1 sequence (starts with 0x30)
    # More specific matching would look for SNMP PDU types.

# Placeholder for a service that might not respond or where probe is just to elicit any response
- name: "echo-udp" # Example, not a standard well-known service with fixed probe like this
  port: 7
  probe: "48656c6c6f484b" # "HelloHK" in hex
  match:
    type: "exact" # If echo server just sends it back
    pattern: "HelloHK" # Expect the same string back (after hex decoding)

# Example for a service that might time out or not respond if not present
- name: "chargen-udp" # Character Generator Protocol
  port: 19
  probe: "0d0a" # Just a CRLF, often enough to trigger response or confirm presence
  # No specific match, presence of any data might indicate chargen. Often filtered.

